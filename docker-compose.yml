# before those containers had actually finished starting, caching stale/wrong IPs for the rest of its lifetime
# (only a full gateway restart re-resolved them) — service_started only waits for the container process to be
# launched, not for it to actually be reachable. service_healthy makes the gateway wait for a real response from
