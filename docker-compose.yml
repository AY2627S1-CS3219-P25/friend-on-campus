include:
  - path: ./services/user-service/docker-compose.yml

services:
  # ----------------------------------------------------
  # Ingress API Gateway & Reverse Proxy (Nginx)
  # ----------------------------------------------------
  api-gateway:
    image: nginx:alpine
    container_name: campuserrand-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      student-app:
        condition: service_started
      admin-portal:
        condition: service_started
      user-service:
        condition: service_healthy
      supplier-service:
        condition: service_started
      order-service:
        condition: service_started
      credit-service:
        condition: service_started
      notification-service:
        condition: service_started

  # ----------------------------------------------------
  # Frontend Applications (Vite + React)
  # ----------------------------------------------------
  student-app:
    build:
      context: .
      dockerfile: apps/student-app/Dockerfile
    container_name: campuserrand-student-app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api

  admin-portal:
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    container_name: campuserrand-admin-portal
    ports:
      - "5174:5174"
    environment:
      - SUPPLIER_SERVICE_URL=http://supplier-service:8002
      - USER_SERVICE_URL=http://user-service:8001

  # ----------------------------------------------------
  # Backend Microservices (Node + tsx)
  # ----------------------------------------------------
  supplier-service:
    build:
      context: .
      dockerfile: services/supplier-service/Dockerfile
    container_name: campuserrand-supplier-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/supplier_db
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: campuserrand-order-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/order_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - CREDIT_SERVICE_URL=http://credit-service:8004
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  credit-service:
    build:
      context: .
      dockerfile: services/credit-service/Dockerfile
    container_name: campuserrand-credit-service
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/credit_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: campuserrand-notification-service
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ----------------------------------------------------
  # Infrastructure: PostgreSQL & RabbitMQ
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: campuserrand-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: campuserrand-rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
