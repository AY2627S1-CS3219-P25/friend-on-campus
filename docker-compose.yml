# AI Assistance Disclosure:
# Tool: Codex (model: GPT-6, GPT-5, GPT-5.6 Terra); Claude Code (model: Claude Fable 5.1, Sonnet 5); Google Antigravity Agent; Google Antigravity (model: Claude Opus 4.6), date: 2026-09-22 to 2026-11-08
# Scope: Supplied the author-approved Ed25519 verification configuration to Supplier Service; updated across 22 AI-assisted revisions through D4 wrap-up (preserve local migration/seed startup while images start only the app, and allow bounded socket-service shutdown).
# Author review: I validated correctness, edited for style, and verified with automated tests.


services:
  # ----------------------------------------------------
  # Ingress API Gateway & Reverse Proxy (Nginx)
  # ----------------------------------------------------
  api-gateway:
    image: nginx:1.31.7-alpine3.24@sha256:42c36dfd0b3503b7966771550a91521262b4750665929821abf5069715610e20
    container_name: campuserrand-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/images:/usr/share/nginx/html/images:ro
    depends_on:
      student-app:
        condition: service_healthy
      admin-portal:
        condition: service_healthy
      user-service:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      credit-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy

  # ----------------------------------------------------
  # Frontend Applications (statically built React served by NGINX)
  # ----------------------------------------------------
  student-app:
    build:
      context: .
      dockerfile: apps/student-app/Dockerfile
      args:
        VITE_SHOW_WS_STATUS: ${VITE_SHOW_WS_STATUS:-true}
    container_name: campuserrand-student-app
    ports:
      - "5173:5173"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:5173/
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  admin-portal:
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    container_name: campuserrand-admin-portal
    ports:
      - "5174:5174"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:5174/admin/
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------
  # Backend Microservices (compiled JavaScript on Node)
  # ----------------------------------------------------
  user-service:
    # Local bootstrap stays in Compose, outside the cloud application command.
    command: ["sh", "-c", "/app/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && node dist/database/seed.js && exec node dist/index.js"]
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: campuserrand-user-service
    init: true # Node is PID 1 and ignores SIGTERM without an init
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DATABASE_URL: postgresql://user_svc:user-service-dev@postgres:5432/user_db
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      JWT_ISSUER: ${JWT_ISSUER:-friend-on-campus-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-friend-on-campus-services}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-1d}
      JWT_PERSISTENT_REFRESH_TOKEN_TTL: ${JWT_PERSISTENT_REFRESH_TOKEN_TTL:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  supplier-service:
    command: ["sh", "-c", "/app/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && node dist/database/seed.js && exec node dist/index.js"]
    build:
      context: .
      dockerfile: services/supplier-service/Dockerfile
    container_name: campuserrand-supplier-service
    init: true # Node is PID 1 and ignores SIGTERM without an init
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://supplier_svc:supplier-service-dev@postgres:5432/supplier_db
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      - JWT_ISSUER=${JWT_ISSUER:-friend-on-campus-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-friend-on-campus-services}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8002/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-service:
    command: ["sh", "-c", "/app/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && (node dist/database/seed.js || echo >&2 '[order-seed] Automatic startup seed skipped or failed') && exec node dist/index.js"]
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: campuserrand-order-service
    restart: unless-stopped
    init: true # Node is PID 1 and ignores SIGTERM without an init
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      # Local demo default; set false for deployments with real orders.
      - SEED_SAMPLE_ORDERS=${SEED_SAMPLE_ORDERS:-true}
      - DATABASE_URL=postgresql://order_svc:order-service-dev@postgres:5432/order_db
      - RABBITMQ_URL=amqp://order_service:order-service-dev@rabbitmq:5672/campus
      - SUPPLIER_SERVICE_URL=http://supplier-service:8002
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      - JWT_ISSUER=${JWT_ISSUER:-friend-on-campus-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-friend-on-campus-services}
      # NUS SoCLaaS LLM gateway configuration for Assistant (F6)
      - SOCLAAS_BASE_URL=${SOCLAAS_BASE_URL:-https://soclaas-api.comp.nus.edu.sg/v1}
      - SOCLAAS_API_KEY=${SOCLAAS_API_KEY:-}
      - SOCLAAS_MODEL=${SOCLAAS_MODEL:-default}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  credit-service:
    command: ["sh", "-c", "/app/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && (node dist/database/seed.js || echo >&2 '[credit-seed] Automatic startup seed failed; continuing without development wallet seeding') && exec node dist/index.js"]
    build:
      context: .
      dockerfile: services/credit-service/Dockerfile
    container_name: campuserrand-credit-service
    init: true # Node is PID 1 and ignores SIGTERM without an init
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - SEED_SAMPLE_ORDERS=${SEED_SAMPLE_ORDERS:-true}
      - DATABASE_URL=postgresql://credit_svc:credit-service-dev@postgres:5432/credit_db
      - USER_SERVICE_URL=http://user-service:8001
      - RABBITMQ_URL=amqp://credit_service:credit-service-dev@rabbitmq:5672/campus
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      - JWT_ISSUER=${JWT_ISSUER:-friend-on-campus-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-friend-on-campus-services}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  notification-service:
    command: ["sh", "-c", "/app/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && exec node dist/index.js"]
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: campuserrand-notification-service
    init: true # Node is PID 1 and ignores SIGTERM without an init
    # The service exits when its broker connection fails and relies on this to come back.
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - DATABASE_URL=postgresql://notification_svc:notification-service-dev@postgres:5432/notification_db
      - RABBITMQ_URL=amqp://notification_service:notification-service-dev@rabbitmq:5672/campus
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      - JWT_ISSUER=${JWT_ISSUER:-friend-on-campus-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-friend-on-campus-services}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8005/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Chat Service (F8), same shape as notification-service.
  chat-service:
    command: ["sh", "-c", "/app/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && exec node dist/index.js"]
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: campuserrand-chat-service
    init: true # node is PID 1 and ignores SIGTERM without an init
    # The service exits when its broker connection fails and relies on this to come back.
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - PORT=8006
      - DATABASE_URL=postgresql://chat_svc:chat-service-dev@postgres:5432/chat_db
      - RABBITMQ_URL=amqp://chat_service:chat-service-dev@rabbitmq:5672/campus
      - ORDER_SERVICE_URL=http://order-service:8003
      # SoCLaaS settings for optional chat message translation
      - SOCLAAS_BASE_URL=${SOCLAAS_BASE_URL:-https://soclaas-api.comp.nus.edu.sg/v1}
      - SOCLAAS_API_KEY=${SOCLAAS_API_KEY:-}
      - SOCLAAS_MODEL=${SOCLAAS_MODEL:-default}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      - JWT_ISSUER=${JWT_ISSUER:-friend-on-campus-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-friend-on-campus-services}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8006/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------
  # Infrastructure: PostgreSQL & RabbitMQ
  # ----------------------------------------------------
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: campuserrand-postgres
    # Enable logical WAL decoding for Debezium CDC Outbox Event Router
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: campuserrand-rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      # Probe as the server user, otherwise a root-run probe can create a root-owned
      # .erlang.cookie before the server does. The container itself stays root so the entrypoint still repairs ownership.
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      # Each probe boots a throwaway Erlang VM (3.4-5.5 s here, up to 18.7 s on a
      # loaded host), and a cold boot took 231 s on a 5 GB VM; 60 s + 5 x 10 s gave up before Erlang had started.
      timeout: 20s
      retries: 5
      start_period: 180s

  # Log-based Debezium Server Outbox CDC connector
  debezium-order:
    image: quay.io/debezium/server:2.7
    container_name: campuserrand-debezium-order
    restart: unless-stopped
    volumes:
      - ./docker/debezium/application.properties:/debezium/conf/application.properties:ro
      - debezium_data:/debezium/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_healthy

  debezium-user:
    image: quay.io/debezium/server:2.7
    container_name: campuserrand-debezium-user
    restart: unless-stopped
    volumes:
      - ./docker/debezium/user.properties:/debezium/conf/application.properties:ro
      - debezium_user_data:/debezium/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy

  debezium-credit:
    image: quay.io/debezium/server:2.7
    container_name: campuserrand-debezium-credit
    restart: unless-stopped
    volumes:
      - ./docker/debezium/credit.properties:/debezium/conf/application.properties:ro
      - debezium_credit_data:/debezium/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      credit-service:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  debezium_data:
  debezium_user_data:
  debezium_credit_data:
