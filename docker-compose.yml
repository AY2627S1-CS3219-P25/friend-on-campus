services:
  # ----------------------------------------------------
  # Ingress API Gateway & Reverse Proxy (Nginx)
  # ----------------------------------------------------
  api-gateway:
    image: nginx:alpine
    container_name: campuserrand-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      student-app:
        condition: service_healthy
      admin-portal:
        condition: service_healthy
      user-service:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      credit-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  # ----------------------------------------------------
  # Frontend Applications (Vite + React)
  # ----------------------------------------------------
  student-app:
    build:
      context: .
      dockerfile: apps/student-app/Dockerfile
    container_name: campuserrand-student-app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api
      - ADMIN_PORTAL_URL=http://admin-portal:5174
      - SUPPLIER_SERVICE_URL=http://supplier-service:8002
      - USER_SERVICE_URL=http://user-service:8001
      - GATEWAY_URL=http://api-gateway:80
      - NOTIFICATION_SERVICE_URL=ws://notification-service:8005
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  admin-portal:
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    container_name: campuserrand-admin-portal
    ports:
      - "5174:5174"
    environment:
      - SUPPLIER_SERVICE_URL=http://supplier-service:8002
      - USER_SERVICE_URL=http://user-service:8001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:5174/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------
  # Backend Microservices (Node + tsx)
  # ----------------------------------------------------
  # AI-generated (edited by ngkhengyang)
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: campuserrand-user-service
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/user_db
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      JWT_ISSUER: ${JWT_ISSUER:-friend-on-campus-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-friend-on-campus-services}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-1d}
      JWT_PERSISTENT_REFRESH_TOKEN_TTL: ${JWT_PERSISTENT_REFRESH_TOKEN_TTL:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  supplier-service:
    build:
      context: .
      dockerfile: services/supplier-service/Dockerfile
    container_name: campuserrand-supplier-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/supplier_db
      # AI-generated (edited by ngkhengyang)
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?Run `npm run generate:jwt-keys` and paste JWT_PRIVATE_KEY and JWT_PUBLIC_KEY into .env}
      - JWT_ISSUER=${JWT_ISSUER:-friend-on-campus-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-friend-on-campus-services}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: campuserrand-order-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/order_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - CREDIT_SERVICE_URL=http://credit-service:8004
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  credit-service:
    build:
      context: .
      dockerfile: services/credit-service/Dockerfile
    container_name: campuserrand-credit-service
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/credit_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: campuserrand-notification-service
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8005/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------
  # Infrastructure: PostgreSQL & RabbitMQ
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: campuserrand-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: campuserrand-rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
