services:
  user-db:
    image: postgres:16-alpine
    container_name: campuserrand-user-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      # The local PostgreSQL server already uses 5432.
      - "5433:5432"
    volumes:
      - user_service_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: campuserrand-user-service
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/user_db
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
    depends_on:
      user-db:
        condition: service_healthy

volumes:
  user_service_postgres_data:
