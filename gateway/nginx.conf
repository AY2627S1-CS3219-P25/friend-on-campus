# AI Assistance Disclosure:
# Tool: Google Antigravity Agent; Claude Code (model: Claude Fable 5.1); Google Antigravity (model: Claude Opus 4.6); Codex (model: GPT-6), date: 2026-10-01 to 2026-11-09
# Scope: Route bare user and credit collection paths and reject unknown API paths; updated across 7 AI-assisted revisions through D4 wrap-up (issue #253: Added upstream blocks with `resolve` (10 s DNS TTL via Docker resolver) and HTTP/1.1 `keepalive` connection pooling so high-throughput backend..).
# Author review: I validated correctness, edited for style, and verified with automated tests.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker's embedded DNS. A service name in a variable is re-resolved when the cached answer is older than the TTL,
    # so a container that came back with a new address is found without a gateway restart (#173).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # A backend that is down fails fast instead of holding the browser on a spinner for the 60 s default (#169).
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Upstream blocks with dynamic DNS re-resolution (`resolve`, #173) and HTTP/1.1 keepalive connection pooling (#253).
    upstream student_app_upstream {
        zone student_app_upstream 64k;
        server student-app:5173 resolve;
        keepalive 32;
    }

    upstream admin_portal_upstream {
        zone admin_portal_upstream 64k;
        server admin-portal:5174 resolve;
        keepalive 32;
    }

    upstream user_service_upstream {
        zone user_service_upstream 64k;
        server user-service:8001 resolve;
        keepalive 64;
        keepalive_requests 10000;
    }

    upstream supplier_service_upstream {
        zone supplier_service_upstream 64k;
        server supplier-service:8002 resolve;
        keepalive 64;
        keepalive_requests 10000;
    }

    upstream order_service_upstream {
        zone order_service_upstream 64k;
        server order-service:8003 resolve;
        keepalive 64;
        keepalive_requests 10000;
    }

    upstream credit_service_upstream {
        zone credit_service_upstream 64k;
        server credit-service:8004 resolve;
        keepalive 64;
        keepalive_requests 10000;
    }

    upstream notification_service_upstream {
        zone notification_service_upstream 64k;
        server notification-service:8005 resolve;
        keepalive 64;
        keepalive_requests 10000;
    }

    upstream chat_service_upstream {
        zone chat_service_upstream 64k;
        server chat-service:8006 resolve;
        keepalive 64;
        keepalive_requests 10000;
    }

    # API Gateway Server (Port 80)
    server {
        listen 80;
        server_name localhost;

        # Upstream targets routed through keepalive-enabled upstream blocks (resolved via Docker DNS above).
        set $student_app          http://student_app_upstream;
        set $admin_portal         http://admin_portal_upstream;
        set $user_service         http://user_service_upstream;
        set $supplier_service     http://supplier_service_upstream;
        set $order_service        http://order_service_upstream;
        set $credit_service       http://credit_service_upstream;
        set $notification_service http://notification_service_upstream;
        set $chat_service         http://chat_service_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Health check endpoint for ALB and K8s probes
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ----------------------------------------------------
        # 1. User & Authentication Service (M2)
        # ----------------------------------------------------
        location /api/auth/ {
            proxy_pass $user_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/users/ {
            proxy_pass $user_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/users {
            proxy_pass $user_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------
        # 2. Supplier Service (M3)
        # ----------------------------------------------------
        location /api/suppliers/ {
            proxy_pass $supplier_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/suppliers {
            proxy_pass $supplier_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------
        # 3. Order Service (M4)
        # ----------------------------------------------------
        location /api/orders/ {
            proxy_pass $order_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/orders {
            proxy_pass $order_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------
        # 4. Credit & Escrow Service (M5)
        # ----------------------------------------------------
        # Block external ingress to internal escrow namespace
        location /api/credits/escrow {
            return 403;
        }

        location /api/credits/ {
            proxy_pass $credit_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/credits {
            proxy_pass $credit_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/notifications/ {
            proxy_pass $notification_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/notifications {
            proxy_pass $notification_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Chat Service (F8): REST under /api/chat, its own WebSocket path under /ws/chat/ (F8 brief, D3).
        location /api/chat/ {
            proxy_pass $chat_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/chat {
            proxy_pass $chat_service$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/chat/ {
            proxy_pass $chat_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------
        # 5. Live WebSockets & Notifications (M6 / N1)
        # ----------------------------------------------------
        location /ws/ {
            proxy_pass $notification_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------
        # 5b. Microservice Health & Readiness Probes (N4)
        # ----------------------------------------------------
        location = /api/health/user/health {
            proxy_pass $user_service/health;
            proxy_set_header Host $host;
        }
        location = /api/health/user/ready {
            proxy_pass $user_service/ready;
            proxy_set_header Host $host;
        }
        location = /api/health/supplier/health {
            proxy_pass $supplier_service/health;
            proxy_set_header Host $host;
        }
        location = /api/health/supplier/ready {
            proxy_pass $supplier_service/ready;
            proxy_set_header Host $host;
        }
        location = /api/health/order/health {
            proxy_pass $order_service/health;
            proxy_set_header Host $host;
        }
        location = /api/health/order/ready {
            proxy_pass $order_service/ready;
            proxy_set_header Host $host;
        }
        location = /api/health/credit/health {
            proxy_pass $credit_service/health;
            proxy_set_header Host $host;
        }
        location = /api/health/credit/ready {
            proxy_pass $credit_service/ready;
            proxy_set_header Host $host;
        }
        location = /api/health/notification/health {
            proxy_pass $notification_service/health;
            proxy_set_header Host $host;
        }
        location = /api/health/notification/ready {
            proxy_pass $notification_service/ready;
            proxy_set_header Host $host;
        }
        # The sixth service (#206)
        location = /api/health/chat/health {
            proxy_pass $chat_service/health;
            proxy_set_header Host $host;
        }
        location = /api/health/chat/ready {
            proxy_pass $chat_service/ready;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------
        # 6. Admin Portal
        # ----------------------------------------------------
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass $admin_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Static campus supplier images
        location /images/ {
            alias /usr/share/nginx/html/images/;
            access_log off;
            expires 7d;
        }

        # Unknown API paths must not fall through to a frontend proxy.
        location = /api { return 404; }
        location /api/ { return 404; }

        # ----------------------------------------------------
        # 7. Student Mobile Web App (Default Ingress)
        # ----------------------------------------------------
        location / {
            proxy_pass $student_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
