# Scope: Added the chat_service upstream, /api/chat routes and the /ws/chat/ upgrade for the Chat Service (F8).
# Author review: <to be completed by Reallyeasy1>
#
# Tool: Claude Code (model: Claude Fable 5.1), date: 2026-10-05
# Scope: Route /api/notifications to the Notification Service, mirroring the credit-service locations.
# Author review: <to be completed by Reallyeasy1>
