# upstream hostnames are now resolved through Docker's embedded DNS with a 10 s TTL and passed through variables, so a
# restarted service container with a new address is reached without restarting the gateway; proxy_connect_timeout is
# 3 s instead of the 60 s default so a stopped backend answers 502 quickly. Issue #206: /api/health/chat/{health,ready}
# proxy routes for the Admin Portal health dashboard. The upstream blocks are gone: with variables nginx resolves the
# service name per request (cached for the TTL), which is what the blocks prevented.
