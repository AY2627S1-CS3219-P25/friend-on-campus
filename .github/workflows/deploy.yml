name: Continuous Deployment (AWS K3s Cluster)

on:
  push:
    branches:
      - main
      - feat/cloud-and-k6
    paths:
      - 'services/**'
      - 'apps/**'
      - 'packages/**'
      - 'gateway/**'
      - 'data/images/**'
      - 'infra/k8s/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service to deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - user-service
          - supplier-service
          - order-service
          - credit-service
          - notification-service
          - chat-service
          - gateway
          - student-app
          - admin-portal
      run_migrations:
        description: 'Execute Prisma database migrations before rollout?'
        required: true
        default: true
        type: boolean

permissions:
  id-token: write # Required for requesting AWS STS credentials via OpenID Connect (OIDC)
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false # Never terminate a deployment mid-rollout

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: '891498120071'
  ROLE_TO_ASSUME: arn:aws:iam::891498120071:role/foc-production-github-actions-cd-role
  ECR_REGISTRY: 891498120071.dkr.ecr.ap-southeast-1.amazonaws.com

jobs:
  # ============================================================================
  # Step 1: Detect Changed Services
  # ============================================================================
  detect-changes:
    name: Detect Changed Workloads
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Path Filter Matrix
        id: filter
        uses: dorny/paths-filter@v3
        if: ${{ github.event_name == 'push' }}
        with:
          filters: |
            user-service:
              - 'services/user-service/**'
              - 'packages/**'
            supplier-service:
              - 'services/supplier-service/**'
              - 'packages/**'
            order-service:
              - 'services/order-service/**'
              - 'packages/**'
            credit-service:
              - 'services/credit-service/**'
              - 'packages/**'
            notification-service:
              - 'services/notification-service/**'
              - 'packages/**'
            chat-service:
              - 'services/chat-service/**'
              - 'packages/**'
            gateway:
              - 'gateway/**'
              - 'data/images/**'
            student-app:
              - 'apps/student-app/**'
            admin-portal:
              - 'apps/admin-portal/**'

  # ============================================================================
  # Step 2: Build & Push Container Images to AWS ECR
  # ============================================================================
  build-and-push:
    name: Build & Push Container Image
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [
          user-service,
          supplier-service,
          order-service,
          credit-service,
          notification-service,
          chat-service,
          gateway,
          student-app,
          admin-portal
        ]
    steps:
      - name: Determine if Service Needs Build
        id: check-build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.service }}" = "all" ] || [ "${{ github.event.inputs.service }}" = "${{ matrix.service }}" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Push trigger: check if detected in paths-filter
            CHANGES='${{ needs.detect-changes.outputs.services }}'
            if echo "$CHANGES" | grep -q "${{ matrix.service }}"; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout Repository
        if: steps.check-build.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Architecture Emulation)
        if: steps.check-build.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check-build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to AWS via IAM OIDC (Keyless Auth)
        if: steps.check-build.outputs.build == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}

      - name: Log in to Amazon ECR
        if: steps.check-build.outputs.build == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve Dockerfile and Context
        if: steps.check-build.outputs.build == 'true'
        id: docker-meta
        run: |
          SERVICE="${{ matrix.service }}"
          if [[ "$SERVICE" == "gateway" ]]; then
            echo "dockerfile=gateway/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "context=." >> "$GITHUB_OUTPUT"
          elif [[ "$SERVICE" == *"app"* ]] || [[ "$SERVICE" == *"portal"* ]]; then
            echo "dockerfile=apps/$SERVICE/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "context=." >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=services/$SERVICE/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "context=." >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push Docker Image
        if: steps.check-build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.docker-meta.outputs.context }}
          file: ${{ steps.docker-meta.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/foc/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/foc/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Step 3: Zero-Downtime Deployment via AWS Systems Manager (SSM)
  # ============================================================================
  deploy:
    name: Deploy to K3s Cluster
    needs: [detect-changes, build-and-push]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to AWS via IAM OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}

      - name: Find K3s Master Instance ID
        id: master-info
        run: |
          MASTER_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=k3s-master-and-database" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          
          if [ -z "$MASTER_ID" ] || [ "$MASTER_ID" = "None" ]; then
            echo "ERROR: Could not locate running K3s Master instance."
            exit 1
          fi
          
          echo "Found K3s Master Instance: $MASTER_ID"
          echo "master_instance_id=$MASTER_ID" >> "$GITHUB_OUTPUT"

      - name: Execute Pre-Deploy Migrations & Kubernetes Rollout via AWS SSM
        run: |
          MASTER_ID="${{ steps.master-info.outputs.master_instance_id }}"
          IMAGE_TAG="${{ github.sha }}"
          RUN_MIGRATIONS="${{ github.event.inputs.run_migrations || 'true' }}"

          echo "Initiating SSM Run Command on Master ($MASTER_ID)..."

          # Remote command executed directly on K3s master
          COMMANDS=$(cat <<EOF
          set -e
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          echo "==> [0/3] Ensuring ECR authentication credentials are fresh"
          if [ -x /usr/local/bin/refresh-ecr.sh ]; then
            /usr/local/bin/refresh-ecr.sh || true
          fi

          echo "==> [1/3] Refreshing K8s Manifests"
          cd /opt/friend-on-campus || true
          if [ -d "/opt/friend-on-campus/.git" ]; then
            git fetch origin && (git checkout -f ${{ github.ref_name }} || git checkout -f main) && git pull || true
            kubectl apply -f infra/k8s/
          fi

          echo "==> [2/3] Rolling update container images to tag: $IMAGE_TAG"
          for deploy in user-service supplier-service order-service credit-service notification-service chat-service api-gateway student-app admin-portal; do
            IMAGE_REPO="foc/\$deploy"
            if [ "\$deploy" = "api-gateway" ]; then
              IMAGE_REPO="foc/gateway"
            fi
            if kubectl get deployment "\$deploy" -n foc >/dev/null 2>&1; then
              if /usr/local/bin/aws ecr describe-images --repository-name "\$IMAGE_REPO" --image-ids imageTag="$IMAGE_TAG" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
                echo "Updating deployment: \$deploy with tag $IMAGE_TAG (ECR repo: \$IMAGE_REPO)"
                kubectl set image deployment/"\$deploy" "\$deploy"=${{ env.ECR_REGISTRY }}/"\$IMAGE_REPO":$IMAGE_TAG -n foc || true
              else
                echo "Tag $IMAGE_TAG not found for \$IMAGE_REPO, skipping deployment update."
              fi
            fi
          done

          echo "==> [3/3] Verifying Pod Rollout Status"
          kubectl rollout status deployment/order-service -n foc --timeout=120s || true
          kubectl rollout status deployment/credit-service -n foc --timeout=120s || true
          kubectl rollout status deployment/api-gateway -n foc --timeout=120s || true

          echo "==> Deployment Successfully Finalized!"
          kubectl get pods -n foc -o wide
          EOF
          )

          # Safely encode commands using jq to prevent shell-escaping/JSON parse errors
          PARAMETERS=$(jq -n --arg cmd "$COMMANDS" '{"commands": [$cmd]}')

          # Send Command via AWS SSM
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$MASTER_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Continuous Deployment from GitHub Actions ($GITHUB_SHA)" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command Dispatched. Command ID: $CMD_ID"
          echo "Waiting for command execution to complete..."

          # Resilient polling loop for SSM execution
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$MASTER_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "SSM Command Status: $STATUS ($i/60)"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            sleep 5
          done

          # Retrieve stdout and stderr logs
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$MASTER_ID" \
            --query "StandardOutputContent" \
            --output text)

          echo "--- SSM Command Output ---"
          echo "$OUTPUT"
          echo "--------------------------"
