name: PR links an issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Require a closing keyword (Closes/Fixes/Resolves #N) in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\b[[:space:]]*:?[[:space:]]*(#|https://github\.com/[^/[:space:]]+/[^/[:space:]]+/issues/)[0-9]+'; then
            echo "PR body references an issue with a closing keyword."
          else
            echo "::error::PR description must reference the issue(s) it resolves, e.g. 'Closes #12'. Fill in the 'Linked issues' section of the PR template."
            exit 1
          fi
