      - name: Build and start isolated Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d --wait --wait-timeout 300
      - name: Stop services spawned by the API E2E suite
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml stop user-service supplier-service
      - name: Run API E2E suite
        run: npm run test:e2e:api
      - name: Collect Compose logs
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps -a > ci-logs/docker-compose-ps.log
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color > ci-logs/docker-compose.log 2>&1
      - name: Upload API E2E failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-api-failure
          path: ci-logs/**
          if-no-files-found: ignore
      - name: Stop isolated Compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans

  browser-uat:
    name: Browser UAT | Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: foc-ci-${{ github.run_id }}-browser
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and generate Prisma clients
        run: npm ci
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Generate throwaway JWT keys
        run: node scripts/generate-jwt-keys.mjs >> "$GITHUB_ENV"
      - name: Build and start isolated Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d --wait --wait-timeout 300
      - name: Run Chromium browser UAT
        run: npm run test:e2e:ui
      - name: Collect Compose logs
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps -a > ci-logs/docker-compose-ps.log
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color > ci-logs/docker-compose.log 2>&1
      - name: Upload browser results, screenshots, and failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-uat-results
          path: |
            test-results/**
            ci-logs/**
          if-no-files-found: ignore
      - name: Stop isolated Compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans

  test-gate:
    name: Test gate
    if: ${{ always() }}
    needs:
      - lint
      - build
      - typecheck
      - test-config
      - unit-tests
      - integration-tests
      - messaging-tests
      - migration-tests
      - seed-tests
      - acceptance-tests
      - e2e-api-tests
      - browser-uat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI category to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          CONFIG_RESULT: ${{ needs.test-config.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          MESSAGING_RESULT: ${{ needs.messaging-tests.result }}
          MIGRATION_RESULT: ${{ needs.migration-tests.result }}
          SEED_RESULT: ${{ needs.seed-tests.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance-tests.result }}
          E2E_API_RESULT: ${{ needs.e2e-api-tests.result }}
          BROWSER_RESULT: ${{ needs.browser-uat.result }}
        run: |
          failed=0
          for result in \
            "lint=$LINT_RESULT" \
            "build=$BUILD_RESULT" \
            "typecheck=$TYPECHECK_RESULT" \
            "test-config=$CONFIG_RESULT" \
            "unit=$UNIT_RESULT" \
            "integration=$INTEGRATION_RESULT" \
            "messaging=$MESSAGING_RESULT" \
            "migration=$MIGRATION_RESULT" \
            "seed=$SEED_RESULT" \
            "acceptance=$ACCEPTANCE_RESULT" \
            "e2e-api=$E2E_API_RESULT" \
            "browser-uat=$BROWSER_RESULT"
          do
            if [ "${result#*=}" != "success" ]; then
              echo "Required job did not succeed: $result"
              failed=1
            fi
          done
          exit "$failed"
