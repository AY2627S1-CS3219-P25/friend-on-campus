name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # AI-generated (edited by ngkhengyang)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22 # root package.json engines: >=22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run db:generate

      - name: Lint
        run: npm run lint

  # AI-generated (edited by ngkhengyang)
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22 # root package.json engines: >=22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run db:generate

      - name: Build all workspaces
        run: npm run build

  unit:
    name: Type checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22 # root package.json engines: >=22.3
          cache: npm

      - name: Install dependencies
        run: npm ci # postinstall generates every service's Prisma client

      - name: Type checks
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          # Opts in services/user-service/test/admin-guard.integration.test.ts, which creates and drops its own schema.
          ADMIN_GUARD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          # Opts in the notification-service store and route tests the same way.
          NOTIFICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  acceptance:
    name: API acceptance (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate throwaway JWT keys
        run: node scripts/generate-jwt-keys.mjs --print > .env

      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 300

      - name: API acceptance checks
        run: node scripts/uat/uat-d2-api.mjs
        env:
          UAT_OUT: uat-d2-api-results.json

      # User Service N1.1 and N1.2 (issue #23), reviewed after the acceptance run has registered accounts, logged in,
      # refreshed and changed a password: every stored password is a scrypt hash, and no password, access token or
      # refresh token appears in any service's log.
      - name: Credential exposure review
        run: |
          docker compose exec -T postgres psql -U postgres -d user_db -Atc \
            "select count(*) from users where left(password_hash, 8) <> chr(36) || 'scrypt' || chr(36)" | grep -qx 0
          if docker compose logs --no-color | grep -E 'Password123!|eyJ[A-Za-z0-9_-]{10,}\.|refresh_token=[A-Za-z0-9_-]{8,}|Bearer [A-Za-z0-9_-]{8,}' | cut -d'|' -f1 | sort | uniq -c | grep .; then
            echo "A credential appears in the logs of the services listed above."
            exit 1
          fi

      # Event in, row stored, frame pushed, duplicate ignored, malformed message dead-lettered: needs the broker,
      # so it runs here against the Compose stack, on its own exchange, queues and database schema.
      - name: Notification Service integration tests
        run: npm test --workspace=@campus-errand/notification-service
        env:
          NOTIFICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notification_db
          NOTIFICATION_TEST_RABBITMQ_URL: amqp://notification_service:notification-service-dev@localhost:5672/campus

      # F5 through the gateway: login, authenticated socket, events published with the order_service account,
      # pushed frames, the REST list and read state.
      - name: Notification acceptance checks
        run: node scripts/uat/uat-notifications.mjs

      # The suite starts its own user-service and supplier-service on 8001/8002 against the Compose database.
      - name: D2 end-to-end suite
        run: |
          docker compose stop user-service supplier-service
          npm run test:d2

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uat-d2-api-results
          path: uat-d2-api-results.json
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose down -v
