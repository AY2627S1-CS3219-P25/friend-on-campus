          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create isolated test database
        run: node scripts/ci/create-test-database.mjs
        env:
          POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
