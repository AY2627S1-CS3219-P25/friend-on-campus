name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all workspaces
        run: npm run build

  typecheck:
    name: Type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check all workspaces
        run: npm run typecheck

  test-config:
    name: Test matrix consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and generate Prisma clients
        run: npm ci
      - name: Validate package scripts against static CI matrices
        run: npm run ci:validate-tests

  unit-tests:
    name: Unit | ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: credit-service
            workspace: '@campus-errand/credit-service'
            script: test:unit
            database: none
            rabbitmq: false
          - name: notification-service
            workspace: '@campus-errand/notification-service'
            script: test:unit
            database: none
            rabbitmq: false
          - name: chat-service
            workspace: '@campus-errand/chat-service'
            script: test:unit
            database: none
            rabbitmq: false
          - name: order-service
            workspace: '@campus-errand/order-service'
            script: test:unit
            database: none
            rabbitmq: false
          - name: student-app
            workspace: '@campus-errand/student-app'
            script: test:unit
            database: none
            rabbitmq: false
          - name: supplier-service
            workspace: '@campus-errand/supplier-service'
            script: test:unit
            database: none
            rabbitmq: false
          - name: user-service
            workspace: '@campus-errand/user-service'
            script: test:unit
            database: none
            rabbitmq: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run configured unit suite
        run: npm run "${{ matrix.script }}" --workspace="${{ matrix.workspace }}"

  integration-tests:
    name: Integration | ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: credit-service
            workspace: '@campus-errand/credit-service'
            script: test:integration
            database: deploy
            rabbitmq: false
          - name: notification-service
            workspace: '@campus-errand/notification-service'
            script: test:integration
            database: deploy
            rabbitmq: false
          - name: chat-service
            workspace: '@campus-errand/chat-service'
            script: test:integration
            database: deploy
            rabbitmq: false
          - name: user-service
            workspace: '@campus-errand/user-service'
            script: test:integration
            database: schema
            rabbitmq: false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create isolated test database
        run: node scripts/ci/create-test-database.mjs
        env:
          POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_DATABASE_NAME: ci_test
      - name: Deploy workspace migrations
        if: matrix.database == 'deploy'
        run: npm run db:deploy --workspace="${{ matrix.workspace }}"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      - name: Run configured integration suite
        run: npm run "${{ matrix.script }}" --workspace="${{ matrix.workspace }}"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          ADMIN_GUARD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          CREDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          NOTIFICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          CHAT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      - name: Collect PostgreSQL logs
        if: failure()
        run: |
          mkdir -p ci-logs
          docker logs "${{ job.services.postgres.id }}" > ci-logs/postgres.log 2>&1 || true
      - name: Upload integration failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-${{ matrix.name }}-failure
          path: ci-logs/**
          if-no-files-found: ignore

  messaging-tests:
    name: Messaging | ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: credit-service
            workspace: '@campus-errand/credit-service'
            script: test:messaging
            database: deploy
            rabbitmq: true
          - name: notification-service
            workspace: '@campus-errand/notification-service'
            script: test:messaging
            database: deploy
            rabbitmq: true
          - name: chat-service
            workspace: '@campus-errand/chat-service'
            script: test:messaging
            database: deploy
            rabbitmq: true
          - name: order-service
            workspace: '@campus-errand/order-service'
            script: test:messaging
            database: deploy
            rabbitmq: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci_test
          RABBITMQ_DEFAULT_PASS: ci-test-password
          RABBITMQ_DEFAULT_VHOST: ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create isolated test database
        run: node scripts/ci/create-test-database.mjs
        env:
          POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_DATABASE_NAME: ci_test
      - name: Deploy workspace migrations
        if: matrix.database == 'deploy'
        run: npm run db:deploy --workspace="${{ matrix.workspace }}"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      # AI-generated (edited by huangjiaxi1111)
      - name: Create credit database for order saga messaging tests
        if: matrix.workspace == '@campus-errand/order-service'
        run: node scripts/ci/create-test-database.mjs
        env:
          POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_DATABASE_NAME: saga_credit_test
      - name: Deploy credit migrations for order saga messaging tests
        if: matrix.workspace == '@campus-errand/order-service'
        run: npm run db:deploy --workspace=@campus-errand/credit-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saga_credit_test
      - name: Enable logical WAL for Credit CDC
        if: matrix.workspace == '@campus-errand/order-service'
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -c "ALTER SYSTEM SET wal_level = logical"
          docker restart "${{ job.services.postgres.id }}"
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start Credit CDC for order saga messaging tests
        if: matrix.workspace == '@campus-errand/order-service'
        run: |
          docker run -d --name credit-messaging-cdc --network host \
            -v "$PWD/docker/debezium/credit.properties:/debezium/conf/application.properties:ro" \
            -e DEBEZIUM_SOURCE_DATABASE_HOSTNAME=localhost \
            -e DEBEZIUM_SOURCE_DATABASE_DBNAME=saga_credit_test \
            -e DEBEZIUM_SOURCE_SLOT_NAME=debezium_credit_messaging \
            -e DEBEZIUM_SOURCE_PUBLICATION_NAME=dbz_credit_messaging_publication \
            -e DEBEZIUM_SOURCE_TOPIC_PREFIX=campus_credit_messaging \
            -e DEBEZIUM_SINK_RABBITMQ_CONNECTION_HOST=localhost \
            -e DEBEZIUM_SINK_RABBITMQ_CONNECTION_USERNAME=ci_test \
            -e DEBEZIUM_SINK_RABBITMQ_CONNECTION_PASSWORD=ci-test-password \
            -e DEBEZIUM_SINK_RABBITMQ_CONNECTION_VIRTUAL_HOST=ci \
            -e DEBEZIUM_SINK_RABBITMQ_EXCHANGE=credit-test.saga-cdc.events \
            quay.io/debezium/server:2.7
          node scripts/ci/wait-for-cdc.mjs
        env:
          CREDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saga_credit_test
      - name: Run configured messaging suite
        run: npm run "${{ matrix.script }}" --workspace="${{ matrix.workspace }}"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          ORDER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          SAGA_TEST_EXCHANGE: credit-test.saga-cdc.events
          RABBITMQ_URL: amqp://ci_test:ci-test-password@localhost:5672/ci
          TEST_RABBITMQ_URL: amqp://ci_test:ci-test-password@localhost:5672/ci
          CREDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ matrix.workspace == '@campus-errand/order-service' && 'saga_credit_test' || 'ci_test' }}
          CREDIT_TEST_RABBITMQ_URL: amqp://ci_test:ci-test-password@localhost:5672/ci
          NOTIFICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          NOTIFICATION_TEST_RABBITMQ_URL: amqp://ci_test:ci-test-password@localhost:5672/ci
          CHAT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          CHAT_TEST_RABBITMQ_URL: amqp://ci_test:ci-test-password@localhost:5672/ci
      - name: Collect PostgreSQL and RabbitMQ logs
        if: failure()
        run: |
          mkdir -p ci-logs
          docker logs "${{ job.services.postgres.id }}" > ci-logs/postgres.log 2>&1 || true
          docker logs "${{ job.services.rabbitmq.id }}" > ci-logs/rabbitmq.log 2>&1 || true
      - name: Collect Credit CDC logs
        if: failure() && matrix.workspace == '@campus-errand/order-service'
        run: docker logs credit-messaging-cdc > ci-logs/credit-cdc.log 2>&1 || true
      - name: Stop Credit CDC
        if: always() && matrix.workspace == '@campus-errand/order-service'
        run: docker rm -f credit-messaging-cdc || true
      - name: Upload messaging failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: messaging-${{ matrix.name }}-failure
          path: ci-logs/**
          if-no-files-found: ignore

  migration-tests:
