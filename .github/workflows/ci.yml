  acceptance-tests:
    name: Acceptance | API and notifications
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: foc-ci-${{ github.run_id }}-acceptance
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate throwaway JWT keys
        run: node scripts/generate-jwt-keys.mjs >> "$GITHUB_ENV"
      - name: Build and start isolated Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d --wait --wait-timeout 300
      - name: Run acceptance suite
        run: npm run test:acceptance
      - name: Credential exposure review
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T postgres psql -U postgres -d user_db -Atc \
            "select count(*) from users where left(password_hash, 8) <> chr(36) || 'scrypt' || chr(36)" | grep -qx 0
          if docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color | grep -E 'Password123!|eyJ[A-Za-z0-9_-]{10,}\.|refresh_token=[A-Za-z0-9_-]{8,}|Bearer [A-Za-z0-9_-]{8,}' | cut -d'|' -f1 | sort | uniq -c | grep .; then
            echo "A credential appears in the logs of the services listed above."
            exit 1
          fi
      - name: Collect Compose logs
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps -a > ci-logs/docker-compose-ps.log
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color > ci-logs/docker-compose.log 2>&1
      - name: Upload acceptance results and failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-results
          path: |
            test-results/**
            ci-logs/**
          if-no-files-found: ignore
      - name: Stop isolated Compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans

  e2e-api-tests:
    name: E2E | D2 API
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: foc-ci-${{ github.run_id }}-e2e-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
