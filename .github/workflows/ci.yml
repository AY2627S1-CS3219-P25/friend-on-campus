      - name: Deploy workspace migrations
        if: matrix.database == 'deploy'
        run: npm run db:deploy --workspace="${{ matrix.workspace }}"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      - name: Run configured seed suite
