          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": []
        }
      ],
      "vhosts": [
        {
          "name": "campus"
        }
      ],
      "exchanges": [
        {
          "name": "campus.events",
          "vhost": "campus",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        },
        {
          "name": "campus.events.dlx",
          "vhost": "campus",
          "type": "direct",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        }
      ],
      "permissions": [
        {
          "user": "campus_admin",
          "vhost": "campus",
