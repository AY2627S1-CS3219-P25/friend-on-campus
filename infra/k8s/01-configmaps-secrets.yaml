          "vhost": "campus",
          "destination": "credit-service.events",
          "destination_type": "queue",
          "routing_key": "order.cancelled",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "credit-service.events",
          "destination_type": "queue",
          "routing_key": "order.expired",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "credit-service.events",
          "destination_type": "queue",
          "routing_key": "order.reservation.requested",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "order-service.events",
          "destination_type": "queue",
          "routing_key": "credit.reservation.succeeded",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "order-service.events",
          "destination_type": "queue",
          "routing_key": "credit.reservation.failed",
          "arguments": {}
