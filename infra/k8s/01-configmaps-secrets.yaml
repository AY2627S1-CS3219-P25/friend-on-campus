          "vhost": "campus",
          "configure": "^$",
          "write": "^campus\\.events$",
          "read": "^$"
        },
        {
          "user": "order_service",
          "vhost": "campus",
          "configure": "^(campus\\.events|order-service\\.events(?:\\.dlq)?)$",
          "write": "^(amq\\.default|campus\\.events|order-service\\.events(?:\\.dlq)?)$",
          "read": "^(campus\\.events|order-service\\.events(?:\\.dlq)?)$"
        },
        {
          "user": "credit_service",
          "vhost": "campus",
          "configure": "^(campus\\.events(?:\\.dlx)?|credit-service\\.events(?:\\.dlq)?)$",
          "write": "^(amq\\.default|campus\\.events(?:\\.dlx)?|credit-service\\.events(?:\\.dlq)?)$",
          "read": "^(campus\\.events(?:\\.dlx)?|credit-service\\.events(?:\\.dlq)?)$"
        },
        {
          "user": "notification_service",
          "vhost": "campus",
          "configure": "^(campus\\.events|notification-service\\.events(?:\\..+)?)$",
          "write": "^(amq\\.default|notification-service\\.events(?:\\..+)?)$",
          "read": "^(campus\\.events|notification-service\\.events(?:\\..+)?)$"
        },
        {
          "user": "credit_test",
          "vhost": "campus",
          "configure": "^credit-test\\..+$",
          "write": "^(amq\\.default|credit-test\\..+)$",
          "read": "^credit-test\\..+$"
        },
        {
          "user": "chat_service",
          "vhost": "campus",
          "configure": "^(campus\\.events|chat-service\\.events(?:\\..+)?)$",
          "write": "^(amq\\.default|chat-service\\.events(?:\\..+)?)$",
          "read": "^(campus\\.events|chat-service\\.events(?:\\..+)?)$"
