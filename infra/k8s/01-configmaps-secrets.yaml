          "destination_type": "queue",
          "routing_key": "user.registered",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "credit-service.events",
          "destination_type": "queue",
          "routing_key": "order.completed",
