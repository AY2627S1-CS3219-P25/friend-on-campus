        {
          "user": "order_service",
          "vhost": "campus",
          "exchange": "campus.events",
          "write": "^order\\.(created|accepted|in_transit|delivered|completed|cancelled|expired|rejected|unassigned|reservation\\.requested)$",
          "read": "^credit\\.reservation\\.(succeeded|failed)$"
