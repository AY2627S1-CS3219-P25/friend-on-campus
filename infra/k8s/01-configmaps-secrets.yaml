apiVersion: v1
kind: ConfigMap
metadata:
  name: foc-common-config
  namespace: foc
data:
  NODE_ENV: "production"
  POSTGRES_HOST: "postgres.foc.svc.cluster.local"
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: "rabbitmq.foc.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  USER_SERVICE_URL: "http://user-service:8001"
  SUPPLIER_SERVICE_URL: "http://supplier-service:8002"
  ORDER_SERVICE_URL: "http://order-service:8003"
  JWT_ISSUER: "friend-on-campus-user-service"
  JWT_AUDIENCE: "friend-on-campus-services"
  JWT_ACCESS_TOKEN_TTL: "15m"
  JWT_REFRESH_TOKEN_TTL: "1d"
  JWT_PERSISTENT_REFRESH_TOKEN_TTL: "30d"
  SEED_SAMPLE_ORDERS: "false"

---
apiVersion: v1
kind: Secret
metadata:
  name: foc-secrets
  namespace: foc
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  USER_DATABASE_URL: "postgresql://user_svc:user-service-dev@postgres:5432/user_db"
  SUPPLIER_DATABASE_URL: "postgresql://supplier_svc:supplier-service-dev@postgres:5432/supplier_db"
  ORDER_DATABASE_URL: "postgresql://order_svc:order-service-dev@postgres:5432/order_db"
  CREDIT_DATABASE_URL: "postgresql://credit_svc:credit-service-dev@postgres:5432/credit_db"
  NOTIFICATION_DATABASE_URL: "postgresql://notification_svc:notification-service-dev@postgres:5432/notification_db"
  CHAT_DATABASE_URL: "postgresql://chat_svc:chat-service-dev@postgres:5432/chat_db"
  ORDER_RABBITMQ_URL: "amqp://order_service:order-service-dev@rabbitmq:5672/campus"
  CREDIT_RABBITMQ_URL: "amqp://credit_service:credit-service-dev@rabbitmq:5672/campus"
  NOTIFICATION_RABBITMQ_URL: "amqp://notification_service:notification-service-dev@rabbitmq:5672/campus"
  CHAT_RABBITMQ_URL: "amqp://chat_service:chat-service-dev@rabbitmq:5672/campus"
  # Default development key pair (real Ed25519 Base64URL keys)
  JWT_PUBLIC_KEY: "MCowBQYDK2VwAyEAagEj7lnVM_ZSsI5EvGDbjCcMwGoYTamEM8xQXuY6b7o"
  JWT_PRIVATE_KEY: "MC4CAQAwBQYDK2VwBCIEIKYLgcHqR9o7QBlBBGQ0SH4llyLKvswNDBzR13JuT032"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: foc
data:
  01-init-databases.sql: |
    CREATE ROLE user_svc WITH LOGIN PASSWORD 'user-service-dev';
    CREATE ROLE supplier_svc WITH LOGIN PASSWORD 'supplier-service-dev';
    CREATE ROLE order_svc WITH LOGIN PASSWORD 'order-service-dev';
    CREATE ROLE credit_svc WITH LOGIN PASSWORD 'credit-service-dev';
    CREATE ROLE notification_svc WITH LOGIN PASSWORD 'notification-service-dev';
    CREATE ROLE chat_svc WITH LOGIN PASSWORD 'chat-service-dev';

    CREATE DATABASE user_db OWNER user_svc;
    CREATE DATABASE supplier_db OWNER supplier_svc;
    CREATE DATABASE order_db OWNER order_svc;
    CREATE DATABASE credit_db OWNER credit_svc;
    CREATE DATABASE notification_db OWNER notification_svc;
    CREATE DATABASE chat_db OWNER chat_svc;

    REVOKE CONNECT ON DATABASE user_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE supplier_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE order_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE credit_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE notification_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE chat_db FROM PUBLIC;

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definitions
  namespace: foc
data:
  rabbitmq.conf: |
    definitions.import_backend = local_filesystem
    definitions.local.path = /etc/rabbitmq/definitions.json
    definitions.skip_if_unchanged = true

  definitions.json: |
    {
      "users": [
        {
          "name": "campus_admin",
          "password_hash": "JP+wnscC+r1mqPN+RmL7UdeWGCshqd22qKS2oLnbfYM5g2vb",
          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": [
            "administrator"
          ]
        },
        {
          "name": "user_service",
          "password_hash": "cjLBkgn9OI7uR88WmW2ADAU5DTYDobxYsLDGepC1ahFjYaoc",
          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": []
        },
        {
          "name": "order_service",
          "password_hash": "JIekOETTOv4PVIOkLqw1GuycfmEM3jjMyFmtJ77mm0UkIrrF",
          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": []
        },
        {
          "name": "credit_service",
          "password_hash": "HIKjH4DE+NIAgeYPhoy+QSWcSuU8LBpc6cK6lK61g31inLGc",
          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": []
        },
        {
          "name": "notification_service",
          "password_hash": "t9k8tqnsleOSJ5yPIhOIQZs97O08JBNXP6935KNZQyEuN3aU",
          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": []
        },
        {
          "name": "credit_test",
          "password_hash": "qyvQla5dIhYFRYKL46uQwwxgRSdPsqXMQlrX0inBcdeZlVIE",
          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": []
        },
        {
          "name": "chat_service",
          "password_hash": "T+pXpYAX3XXMtYFEhOA2HCoIO6UX4a3zpjUyeuB7+zXuPY8Y",
          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": []
        }
      ],
      "vhosts": [
        {
          "name": "campus"
        }
      ],
      "exchanges": [
        {
          "name": "campus.events",
          "vhost": "campus",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        },
        {
          "name": "campus.events.dlx",
          "vhost": "campus",
          "type": "direct",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        }
      ],
      "permissions": [
        {
          "user": "campus_admin",
          "vhost": "campus",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        },
        {
          "user": "user_service",
          "vhost": "campus",
          "configure": "^$",
          "write": "^campus\\.events$",
          "read": "^$"
        },
        {
          "user": "order_service",
          "vhost": "campus",
          "configure": "^(campus\\.events|order-service\\.events(?:\\.dlq)?)$",
          "write": "^(amq\\.default|campus\\.events|order-service\\.events(?:\\.dlq)?)$",
          "read": "^(campus\\.events|order-service\\.events(?:\\.dlq)?)$"
        },
        {
          "user": "credit_service",
          "vhost": "campus",
          "configure": "^(campus\\.events(?:\\.dlx)?|credit-service\\.events(?:\\.dlq)?)$",
          "write": "^(amq\\.default|campus\\.events(?:\\.dlx)?|credit-service\\.events(?:\\.dlq)?)$",
          "read": "^(campus\\.events(?:\\.dlx)?|credit-service\\.events(?:\\.dlq)?)$"
        },
        {
          "user": "notification_service",
          "vhost": "campus",
          "configure": "^(campus\\.events|notification-service\\.events(?:\\..+)?)$",
          "write": "^(amq\\.default|notification-service\\.events(?:\\..+)?)$",
          "read": "^(campus\\.events|notification-service\\.events(?:\\..+)?)$"
        },
        {
          "user": "credit_test",
          "vhost": "campus",
          "configure": "^credit-test\\..+$",
          "write": "^(amq\\.default|credit-test\\..+)$",
          "read": "^credit-test\\..+$"
        },
        {
          "user": "chat_service",
          "vhost": "campus",
          "configure": "^(campus\\.events|chat-service\\.events(?:\\..+)?)$",
          "write": "^(amq\\.default|chat-service\\.events(?:\\..+)?)$",
          "read": "^(campus\\.events|chat-service\\.events(?:\\..+)?)$"
        }
      ],
      "topic_permissions": [
        {
          "user": "user_service",
          "vhost": "campus",
          "exchange": "campus.events",
          "write": "^user\\.registered$",
          "read": "^$"
        },
        {
          "user": "order_service",
          "vhost": "campus",
          "exchange": "campus.events",
          "write": "^order\\.(created|accepted|in_transit|delivered|completed|cancelled|expired|rejected|unassigned|reservation\\.requested)$",
          "read": "^credit\\.reservation\\.(succeeded|failed)$"
        },
        {
          "user": "credit_service",
          "vhost": "campus",
          "exchange": "campus.events",
          "write": "^credit\\.(reservation\\.(succeeded|failed)|escrow\\.(settled|refunded))$",
          "read": "^(user\\.registered|order\\.(completed|cancelled|expired|reservation\\.requested))$"
        },
        {
          "user": "notification_service",
          "vhost": "campus",
          "exchange": "campus.events",
          "write": "^$",
          "read": "^(order\\.(created|accepted|in_transit|delivered|completed|cancelled|expired|rejected|unassigned)|credit\\.escrow\\.(settled|refunded))$"
        }
      ],
      "queues": [
        {
          "name": "credit-service.events",
          "vhost": "campus",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-dead-letter-exchange": "campus.events.dlx",
            "x-dead-letter-routing-key": "credit-service.events.dlq"
          }
        },
        {
          "name": "order-service.events",
          "vhost": "campus",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-dead-letter-exchange": "order-service.events.dlq",
            "x-dead-letter-routing-key": "order-service.events.dlq"
          }
        }
      ],
      "bindings": [
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "credit-service.events",
          "destination_type": "queue",
          "routing_key": "user.registered",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "credit-service.events",
          "destination_type": "queue",
          "routing_key": "order.completed",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "credit-service.events",
          "destination_type": "queue",
          "routing_key": "order.cancelled",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "credit-service.events",
          "destination_type": "queue",
          "routing_key": "order.expired",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "credit-service.events",
          "destination_type": "queue",
          "routing_key": "order.reservation.requested",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "order-service.events",
          "destination_type": "queue",
          "routing_key": "credit.reservation.succeeded",
          "arguments": {}
        },
        {
          "source": "campus.events",
          "vhost": "campus",
          "destination": "order-service.events",
          "destination_type": "queue",
          "routing_key": "credit.reservation.failed",
          "arguments": {}
        }
      ]
    }
