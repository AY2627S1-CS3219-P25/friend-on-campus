apiVersion: v1
kind: ConfigMap
metadata:
  name: foc-common-config
  namespace: foc
data:
  NODE_ENV: "production"
  POSTGRES_HOST: "postgres.foc.svc.cluster.local"
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: "rabbitmq.foc.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  USER_SERVICE_URL: "http://user-service:8001"
  SUPPLIER_SERVICE_URL: "http://supplier-service:8002"
  ORDER_SERVICE_URL: "http://order-service:8003"
  JWT_ISSUER: "friend-on-campus-user-service"
  JWT_AUDIENCE: "friend-on-campus-services"
  JWT_ACCESS_TOKEN_TTL: "15m"
  JWT_REFRESH_TOKEN_TTL: "1d"
  JWT_PERSISTENT_REFRESH_TOKEN_TTL: "30d"
  SEED_SAMPLE_ORDERS: "false"

---
apiVersion: v1
kind: Secret
metadata:
  name: foc-secrets
  namespace: foc
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  USER_DATABASE_URL: "postgresql://user_svc:user-service-dev@postgres:5432/user_db"
  SUPPLIER_DATABASE_URL: "postgresql://supplier_svc:supplier-service-dev@postgres:5432/supplier_db"
  ORDER_DATABASE_URL: "postgresql://order_svc:order-service-dev@postgres:5432/order_db"
  CREDIT_DATABASE_URL: "postgresql://credit_svc:credit-service-dev@postgres:5432/credit_db"
  NOTIFICATION_DATABASE_URL: "postgresql://notification_svc:notification-service-dev@postgres:5432/notification_db"
  CHAT_DATABASE_URL: "postgresql://chat_svc:chat-service-dev@postgres:5432/chat_db"
  ORDER_RABBITMQ_URL: "amqp://order_service:order-service-dev@rabbitmq:5672/campus"
  CREDIT_RABBITMQ_URL: "amqp://credit_service:credit-service-dev@rabbitmq:5672/campus"
  NOTIFICATION_RABBITMQ_URL: "amqp://notification_service:notification-service-dev@rabbitmq:5672/campus"
  CHAT_RABBITMQ_URL: "amqp://chat_service:chat-service-dev@rabbitmq:5672/campus"
  # Default development key pair (real Ed25519 Base64URL keys)
  JWT_PUBLIC_KEY: "MCowBQYDK2VwAyEAagEj7lnVM_ZSsI5EvGDbjCcMwGoYTamEM8xQXuY6b7o"
  JWT_PRIVATE_KEY: "MC4CAQAwBQYDK2VwBCIEIKYLgcHqR9o7QBlBBGQ0SH4llyLKvswNDBzR13JuT032"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: foc
data:
  01-init-databases.sql: |
    CREATE ROLE user_svc WITH LOGIN PASSWORD 'user-service-dev';
    CREATE ROLE supplier_svc WITH LOGIN PASSWORD 'supplier-service-dev';
    CREATE ROLE order_svc WITH LOGIN PASSWORD 'order-service-dev';
    CREATE ROLE credit_svc WITH LOGIN PASSWORD 'credit-service-dev';
    CREATE ROLE notification_svc WITH LOGIN PASSWORD 'notification-service-dev';
    CREATE ROLE chat_svc WITH LOGIN PASSWORD 'chat-service-dev';

    CREATE DATABASE user_db OWNER user_svc;
    CREATE DATABASE supplier_db OWNER supplier_svc;
    CREATE DATABASE order_db OWNER order_svc;
    CREATE DATABASE credit_db OWNER credit_svc;
    CREATE DATABASE notification_db OWNER notification_svc;
    CREATE DATABASE chat_db OWNER chat_svc;

    REVOKE CONNECT ON DATABASE user_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE supplier_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE order_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE credit_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE notification_db FROM PUBLIC;
    REVOKE CONNECT ON DATABASE chat_db FROM PUBLIC;
