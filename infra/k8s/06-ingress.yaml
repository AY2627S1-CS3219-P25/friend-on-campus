# ==============================================================================
# K3s Traefik Ingress Controller Routing
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foc-ingress
  namespace: foc
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          # Route all public traffic to the Friend on Campus API Gateway
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
