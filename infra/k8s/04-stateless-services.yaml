              valueFrom:
                configMapKeyRef:
                  name: foc-common-config
                  key: SUPPLIER_SERVICE_URL
            - name: SEED_SAMPLE_ORDERS
              valueFrom:
                configMapKeyRef:
                  name: foc-common-config
                  key: SEED_SAMPLE_ORDERS
