                  name: foc-common-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: foc-common-config
                  key: JWT_AUDIENCE
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_PUBLIC_KEY
            - name: SOCLAAS_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: foc-common-config
                  key: SOCLAAS_BASE_URL
                  optional: true
            - name: SOCLAAS_MODEL
              valueFrom:
                configMapKeyRef:
                  name: foc-common-config
                  key: SOCLAAS_MODEL
                  optional: true
            - name: SOCLAAS_API_KEY
