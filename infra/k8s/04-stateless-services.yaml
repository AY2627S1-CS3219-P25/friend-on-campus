# ==============================================================================
# 1. User Service (Authentication & User Profiles - Port 8001)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: foc
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: user-service
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        foc.role: worker-node
      containers:
        - name: user-service
          image: 891498120071.dkr.ecr.ap-southeast-1.amazonaws.com/foc/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PORT
              value: "8001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: USER_DATABASE_URL
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: foc-common-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: foc-common-config
                  key: JWT_AUDIENCE
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_PUBLIC_KEY
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_PRIVATE_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: foc
spec:
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: user-service
  type: ClusterIP

