---
# ==============================================================================
# 3. API Gateway (NGINX Reverse Proxy, Rate Limiting & WebSocket Terminus)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: foc
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      nodeSelector:
        foc.role: worker-node
      containers:
        - name: api-gateway
          image: 891498120071.dkr.ecr.ap-southeast-1.amazonaws.com/foc/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: foc
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: api-gateway
  type: ClusterIP
