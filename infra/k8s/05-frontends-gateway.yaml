# ==============================================================================
# 1. Student App (React Single-Page Application)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
  namespace: foc
  labels:
    app: student-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-app
  template:
    metadata:
      labels:
        app: student-app
    spec:
      nodeSelector:
        foc.role: worker-node
      containers:
        - name: student-app
          image: 891498120071.dkr.ecr.ap-southeast-1.amazonaws.com/foc/student-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: student-app
  namespace: foc
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: student-app
  type: ClusterIP

---
