rule_files: [alerts.yaml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'pg_up{job="postgres", instance="database"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgreSQLUnavailable
        exp_alerts:
          - exp_labels: {job: postgres, instance: database, severity: critical}
            exp_annotations:
              summary: PostgreSQL exporter cannot query its database
  - interval: 1m
    input_series:
      - series: 'pg_up{job="postgres", instance="database"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgreSQLUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'pg_order_workflow_oldest_pending_seconds{status="PENDING"}'
        values: '180x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: OrderReservationStalled
        exp_alerts:
          - exp_labels: {status: PENDING, severity: warning}
            exp_annotations:
              summary: An order has remained pending for more than two minutes
