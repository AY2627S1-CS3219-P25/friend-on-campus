extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include: [/host-logs/*/*-json.log]
    start_at: end
    include_file_path: true
    storage: file_storage
    operators:
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^/host-logs/(?P<container_id>[a-f0-9]{64})/'
      - type: move
        from: attributes.container_id
        to: resource["container.id"]
      - type: remove
        field: attributes["log.file.path"]
      - type: json_parser
        parse_to: attributes.container
      - type: move
        from: attributes.container.log
        to: body
      - type: copy
        from: attributes.container.attrs["com.docker.compose.service"]
        to: resource["service.name"]
        if: 'attributes.container.attrs != nil and attributes.container.attrs["com.docker.compose.service"] != nil'
      - type: filter
        expr: 'resource["service.name"] == nil'
      - type: remove
        field: attributes.container
  nginx:
    endpoint: http://api-gateway:8088/nginx_status
    collection_interval: 15s
  docker_stats:
    endpoint: tcp://docker-api:2375
    api_version: "1.44"
    metrics:
      container.restarts:
        enabled: true
      container.uptime:
        enabled: true
    collection_interval: 15s
    timeout: 5s
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.instance.id", "host.name", "container.name", "container.id", "deployment.environment.name"])
      - context: span
        statements:
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.instance.id", "host.name", "container.name", "container.id", "deployment.environment.name"])
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.instance.id", "host.name", "container.name", "container.id", "deployment.environment.name"])
      - context: log
        statements:
          - replace_pattern(body, "(?i)Bearer [A-Za-z0-9._~+/-]+=*", "Bearer [REDACTED]")
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    timeout: 3s
    sending_queue:
      queue_size: 256
      storage: file_storage
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 3s
    sending_queue:
      queue_size: 256
      storage: file_storage
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
service:
  extensions: [health_check, file_storage]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp, nginx, docker_stats]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlphttp/loki]
