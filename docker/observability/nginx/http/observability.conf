map $uri $telemetry_route {
    default other;
    ~^/api/auth auth;
    ~^/api/orders orders;
    ~^/api/credits credits;
    ~^/api/suppliers suppliers;
    ~^/api/chat chat;
    ~^/api/notifications notifications;
    ~^/ws/ websocket;
    ~^/telemetry telemetry;
}
log_format observability escape=json '{"event":"gateway.request","route":"$telemetry_route","method":"$request_method","status":$status,"duration":$request_time,"upstream_duration":"$upstream_response_time"}';
access_log /dev/stdout observability;
limit_req_zone $binary_remote_addr zone=telemetry_ingest:1m rate=2r/s;
server {
    listen 8088;
    location = /nginx_status { stub_status; access_log off; }
    location / { return 404; }
}
