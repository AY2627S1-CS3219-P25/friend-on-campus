# AI Assistance Disclosure:
# Tool: Google Antigravity Agent, date: 2026-10-19
# Scope: Configure Debezium Server PostgreSQL-to-RabbitMQ Outbox Event Router for log-based CDC outbox delivery.
# Author review: Validated against Debezium Server 2.7 Outbox Event Router SMT and campus.events RabbitMQ exchange by yanhwee

# AI-generated (edited by yanhwee)
# Sink: RabbitMQ (campus.events topic exchange)
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbitmq
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=order_service
debezium.sink.rabbitmq.connection.password=order-service-dev
debezium.sink.rabbitmq.connection.virtual.host=campus
debezium.sink.rabbitmq.exchange=campus.events
debezium.sink.rabbitmq.routingKeyFromTopicName=true

# Format: Bare JSON payload (disable Kafka Connect schema envelope so AMQP consumers receive plain event JSON)
debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false

# Source: PostgreSQL logical replication (pgoutput)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=order_db
debezium.source.topic.prefix=campus
debezium.source.table.include.list=public.outbox_events
debezium.source.plugin.name=pgoutput

# Outbox Event Router SMT (routes by event_type so AMQP routing key matches event_type on campus.events)
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.id=id
debezium.transforms.outbox.table.field.event.key=aggregate_id
debezium.transforms.outbox.table.field.event.type=event_type
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.route.by.field=event_type
debezium.transforms.outbox.route.topic.replacement=${routedByValue}
debezium.transforms.outbox.table.expand.json.payload=true
